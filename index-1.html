<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Evora Donuts — Final B1-B12</title>
    <meta name="description" content="Evora Donuts - operasional multi-cabang: kasir HP mode gampang 44px, beli bahan satu pintu, stok benar, role manager-area filter, hero KPI omzet/food cost/waste/selisih kas, PWA offline, biaya distribusi per cabang, audit log." />
    <meta name="theme-color" content="#111111" />
    <link rel="icon" href="./logo-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="./logo-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css?v=final20260724" />
  </head>
  <body>
    <div id="root"></div>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
    <script src="./config.js?v=final20260724"></script>
    <script src="./supabaseClient.js?v=final20260724"></script>
    <script src="./error-handler.js?v=final20260724"></script>
    <script src="./ErrorBoundary.js?v=final20260724"></script>
    <!-- validation.js: belum dipakai di bundle manapun saat ini (lihat catatan). Dibiarkan
         ter-load karena tidak berbahaya (cuma nambah 1.5KB), tapi belum memberi manfaat nyata. -->
    <script src="./validation.js?v=final20260724"></script>
    <!-- offline-sync.js & lazy-loader.js SENGAJA DIHAPUS dari sini — lihat penjelasan dari Claude:
         app.bundle.min.js sudah punya sistem antrean offline sendiri yang bekerja dengan benar
         (lewat RPC submit_transaksi_lapak), dan komponen Settings (zt) tidak bisa diekstrak
         dengan aman ke lazy-load karena bergantung pada fungsi lain di dalam bundle yang sama. -->
    <!-- Production: gunakan bundle minified -->
    <script src="./app.bundle.min.js?v=final20260724"></script>
    <!-- Development (uncomment jika perlu debug):
    <script src="./app.bundle.js?v=final20260724"></script>
    -->
    <script>
      // Batch 12 P2: Register service worker PWA untuk cache shell (offline setengah matang → jadi matang)
      // SW registration boleh nunggu 'load' — ini memang praktik yang dianjurkan, tidak mengganggu render.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').then(reg => {
            console.log('SW registered', reg.scope);
          }).catch(err => {
            console.warn('SW failed', err);
          });
        });
      }

      // Render App dibungkus ErrorBoundary — dijalankan SEKALI, segera setelah script ini
      // dieksekusi (semua script di atas, termasuk app.bundle.min.js, sudah pasti selesai
      // load & jalan duluan karena urutan <script> tag). TIDAK menunggu event 'load', supaya
      // tidak terjadi render kedua yang menimpa app (dulu ini penyebab app "hilang" jadi
      // teks "Loading..." setiap kali halaman selesai load).
      (function renderApp() {
        if (!window.ReactDOM || !document.getElementById('root')) {
          console.error('React/ReactDOM atau elemen #root tidak ditemukan.');
          return;
        }
        if (!window.EvoraDonuts) {
          // app.bundle.min.js gagal load / belum expose window.EvoraDonuts.
          document.getElementById('root').innerHTML =
            '<div style="font-family:sans-serif;padding:40px;color:#ef4444;">' +
            '<h2>Aplikasi Gagal Dimuat</h2>' +
            '<p>Bundle utama (app.bundle.min.js) tidak berhasil dimuat. Coba muat ulang halaman.</p>' +
            '</div>';
          return;
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        const AppTree = window.ErrorBoundary
          ? React.createElement(ErrorBoundary, null, React.createElement(EvoraDonuts))
          : React.createElement(EvoraDonuts); // fallback kalau ErrorBoundary.js gagal load
        root.render(AppTree);
      })();
    </script>
  </body>
</html>
