    <meta name="theme-color" content="#111111" />
    <link rel="icon" href="./logo-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="./logo-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css?v=final20260724" />
  </head>
  <body>
    <div id="root"></div>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
    <script src="./config.js?v=final20260724"></script>
    <script src="./supabaseClient.js?v=final20260724"></script>
    <script src="./error-handler.js?v=final20260724"></script>
    <script src="./ErrorBoundary.js?v=final20260724"></script>
    <script src="./validation.js?v=final20260724"></script>
    <script src="./offline-sync.js?v=final20260724"></script>
    <script src="./lazy-loader.js?v=final20260724"></script>
    <!-- Production: gunakan bundle minified -->
    <script src="./app.bundle.min.js?v=final20260724"></script>
    <!-- Development (uncomment jika perlu debug):
    <script src="./app.bundle.js?v=final20260724"></script>
    -->
    <script>
      // Batch 12 P2: Register service worker PWA untuk cache shell (offline setengah matang → jadi matang)
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').then(reg => {
            console.log('SW registered', reg.scope);
          }).catch(err => {
            console.warn('SW failed', err);
          });
        });
      }

      // Wrap App dengan Error Boundary
      window.addEventListener('load', () => {
        if (window.ErrorBoundary && window.ReactDOM && document.getElementById('root')) {
          const root = ReactDOM.createRoot(document.getElementById('root'));
          root.render(
            React.createElement(ErrorBoundary, null,
              React.createElement(EvoraDonuts || (() => React.createElement('div', null, 'Loading...')))
            )
          );
        }
      });
    </script>
  </body>
</html>
